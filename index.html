<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="北京时间">
<meta name="theme-color" content="#0a0a0f">
<meta name="format-detection" content="telephone=no">
<meta name="description" content="诗钟 —— 一座会念诗的钟。零依赖的单文件全屏时钟：大字北京时间、自动轮播的古诗文、5 套深色皮肤与粒子特效。">
<title>诗钟 · Shizhong</title>
<!-- iPad Safari 专用：iOS 不支持元素级全屏 API，改用「添加到主屏幕」得到独立窗口；轻点换句、左右滑动换皮肤、双击隐藏界面 -->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  /* ==================== 皮肤变量 ==================== */
  :root {
    --bg: #0a0a0f;
    --bg-glow: rgba(0,200,255,0.05);
    --text: #e8f0ff;
    --text-glow1: rgba(0,180,255,0.18);
    --text-glow2: rgba(0,180,255,0.08);
    --sec-color: rgba(232,240,255,0.38);
    --date-color: rgba(200,220,255,0.32);
    --slogan-color: rgba(140,200,255,0.55);
    --sep-color: rgba(0,180,255,0.28);
    --hint-color: rgba(200,220,255,0.13);
    --cursor-glow: rgba(0,200,255,0.07);
  }

  [data-theme="navy-star"] {
    --bg: #0a1628;
    --bg-glow: rgba(100,160,255,0.07);
    --text: #cfe0ff;
    --text-glow1: rgba(100,160,255,0.22);
    --text-glow2: rgba(100,160,255,0.10);
    --sec-color: rgba(200,220,255,0.40);
    --date-color: rgba(160,190,240,0.38);
    --slogan-color: rgba(210,180,110,0.62);
    --sep-color: rgba(210,180,110,0.32);
    --hint-color: rgba(160,190,240,0.14);
    --cursor-glow: rgba(100,160,255,0.08);
  }

  [data-theme="navy-aurora"] {
    --bg: #061220;
    --bg-glow: rgba(0,220,200,0.06);
    --text: #a8f2e8;
    --text-glow1: rgba(0,220,200,0.20);
    --text-glow2: rgba(0,220,200,0.09);
    --sec-color: rgba(160,240,232,0.38);
    --date-color: rgba(100,210,195,0.35);
    --slogan-color: rgba(90,220,190,0.58);
    --sep-color: rgba(0,200,180,0.28);
    --hint-color: rgba(100,210,195,0.13);
    --cursor-glow: rgba(0,220,200,0.07);
  }

  [data-theme="forest"] {
    --bg: #0a1a12;
    --bg-glow: rgba(80,200,120,0.06);
    --text: #baf0d2;
    --text-glow1: rgba(80,200,120,0.18);
    --text-glow2: rgba(80,200,120,0.08);
    --sec-color: rgba(186,240,210,0.38);
    --date-color: rgba(150,215,175,0.34);
    --slogan-color: rgba(215,195,115,0.60);
    --sep-color: rgba(215,195,115,0.28);
    --hint-color: rgba(150,215,175,0.13);
    --cursor-glow: rgba(80,200,120,0.07);
  }

  [data-theme="forest-night"] {
    --bg: #061510;
    --bg-glow: rgba(212,164,76,0.055);
    --text: #dccb9e;
    --text-glow1: rgba(212,164,76,0.18);
    --text-glow2: rgba(212,164,76,0.08);
    --sec-color: rgba(220,203,158,0.38);
    --date-color: rgba(190,170,110,0.34);
    --slogan-color: rgba(170,210,150,0.58);
    --sep-color: rgba(170,210,150,0.28);
    --hint-color: rgba(190,170,110,0.13);
    --cursor-glow: rgba(212,164,76,0.07);
  }

  /* ==================== 基础 ==================== */
  /* iOS Safari 的地址栏会让 100vh 溢出，用 100dvh 动态视口 + -webkit-fill-available 兜底 */
  html {
    width: 100%; height: 100%;
    height: -webkit-fill-available;
    height: 100dvh;
    overflow: hidden;
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
  }
  body {
    width: 100%; height: 100%;
    height: -webkit-fill-available;
    height: 100dvh;
    position: fixed;
    inset: 0;
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    -webkit-font-smoothing: antialiased;
  }

  body {
    background: var(--bg);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    /* iPadOS 无 Bahnschrift/Consolas，改用系统等宽字体 SF Mono / Menlo，等宽对齐且带科技感 */
    font-family: ui-monospace, 'SF Mono', 'Menlo', 'Monaco', 'Courier New', monospace;
    user-select: none;
    -webkit-user-select: none;
    cursor: default;
    transition: background 0.8s ease;
  }

  body.hide-cursor { cursor: none; }

  body::before {
    content: '';
    position: fixed;
    top: -50%; left: -50%;
    width: 200%; height: 200%;
    background: radial-gradient(ellipse at 50% 40%, var(--bg-glow) 0%, transparent 62%);
    pointer-events: none;
    z-index: 0;
    animation: breathe 8s ease-in-out infinite alternate;
  }
  @keyframes breathe {
    0%   { opacity: 0.45; transform: scale(1); }
    100% { opacity: 1;    transform: scale(1.06); }
  }

  #particleCanvas {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 0;
  }

  #cursorGlow {
    position: fixed;
    width: 380px; height: 380px;
    border-radius: 50%;
    background: radial-gradient(circle, var(--cursor-glow) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
    transform: translate(-50%, -50%);
    left: -999px; top: -999px;
    transition: background 0.8s;
  }

  /* ==================== 主内容 ==================== */
  .container {
    position: relative;
    z-index: 2;
    text-align: center;
    padding: 0 3vw;
  }

  .time {
    /* 竖屏按宽度、横屏按视高取小值，两种方向都不出屏 */
    font-size: min(19vw, 27vh);
    font-weight: 700;
    color: var(--text);
    letter-spacing: 0.05em;
    text-shadow: 0 0 30px var(--text-glow1), 0 0 70px var(--text-glow2);
    line-height: 1;
    font-variant-numeric: tabular-nums;
    transition: color 0.8s, text-shadow 0.8s;
    white-space: nowrap;
  }

  /* 时:分 变化 —— 极轻微的呼吸，几乎无感 */
  .time.tick { animation: timeSoft 0.7s cubic-bezier(0.22, 1, 0.36, 1); }
  @keyframes timeSoft {
    0%   { filter: brightness(1.16); }
    100% { filter: brightness(1); }
  }

  .seconds {
    font-size: 0.34em;
    font-weight: 400;
    color: var(--sec-color);
    margin-left: 0.12em;
    vertical-align: baseline;
    transition: color 0.8s;
    display: inline-block;
    will-change: transform, opacity, filter;
  }

  /* 秒数变化 —— 柔和上浮 + 去模糊，不再闪动 */
  .seconds.tick { animation: secSoft 0.66s cubic-bezier(0.22, 1, 0.36, 1); }
  @keyframes secSoft {
    0% {
      transform: translateY(0.14em) scale(0.92);
      opacity: 0.42;
      filter: blur(2.4px);
    }
    55% {
      opacity: 0.92;
      filter: blur(0.5px);
    }
    100% {
      transform: translateY(0) scale(1);
      opacity: 1;
      filter: blur(0);
    }
  }

  .date {
    font-size: clamp(15px, 1.7vw, 34px);
    color: var(--date-color);
    letter-spacing: 0.3em;
    margin-top: 1.6em;
    font-weight: 400;
    transition: color 0.8s;
  }

  .separator {
    width: 80px; height: 1px;
    background: linear-gradient(90deg, transparent, var(--sep-color), transparent);
    margin: 1.8em auto;
    transition: background 0.8s;
    animation: sepPulse 4.5s ease-in-out infinite alternate;
  }
  @keyframes sepPulse {
    0%   { width: 62px; opacity: 0.55; }
    100% { width: 105px; opacity: 1; }
  }

  /* 标语容器 —— 用于光带扫过的定位 */
  .sloganWrap {
    position: relative;
    display: inline-block;
    max-width: 88vw;
  }

  .slogan {
    /* iOS 自带宋体-简，衬线质感与 Windows 端一致 */
    font-family: 'Songti SC', 'STSongti-SC-Regular', 'STSong', 'Hiragino Mincho ProN', serif;
    font-size: clamp(15px, 1.75vw, 33px);
    color: var(--slogan-color);
    letter-spacing: 0.18em;
    font-weight: 400;
    line-height: 1.65;
    margin: 0 auto;
    will-change: transform, opacity, filter;
    /* 四重过渡：透明度、位移、模糊、字距 —— 让切换有"呼吸"感 */
    transition:
      opacity   0.62s cubic-bezier(0.16, 1, 0.3, 1),
      transform 0.62s cubic-bezier(0.16, 1, 0.3, 1),
      filter    0.62s cubic-bezier(0.16, 1, 0.3, 1),
      letter-spacing 0.62s cubic-bezier(0.16, 1, 0.3, 1),
      color     0.8s;
  }

  /* 淡出：上飘 + 虚化 + 字距拉开 */
  .slogan.out {
    opacity: 0;
    transform: translateY(-18px);
    filter: blur(6px);
    letter-spacing: 0.34em;
  }

  /* 淡入起点：下方 + 虚化 + 字距收紧（用 .in-prep 瞬间定位，再移除触发过渡） */
  .slogan.in-prep {
    opacity: 0;
    transform: translateY(18px);
    filter: blur(6px);
    letter-spacing: 0.06em;
    transition: none;
  }

  /* 切换时光带横扫 */
  .sweep {
    position: absolute;
    left: 0; top: 50%;
    width: 100%; height: 1px;
    background: linear-gradient(90deg,
      transparent 0%,
      var(--slogan-color) 45%,
      var(--slogan-color) 55%,
      transparent 100%);
    opacity: 0;
    pointer-events: none;
    transform: scaleX(0.2);
    filter: blur(0.5px);
  }
  .sweep.run { animation: sweepGo 1.05s cubic-bezier(0.16, 1, 0.3, 1); }
  @keyframes sweepGo {
    0%   { opacity: 0;    transform: translateY(0) scaleX(0.15); }
    25%  { opacity: 0.55; }
    60%  { opacity: 0.35; }
    100% { opacity: 0;    transform: translateY(0) scaleX(1.05); }
  }

  /* ==================== 皮肤选择器 ==================== */
  .theme-dots {
    position: fixed;
    bottom: calc(68px + env(safe-area-inset-bottom, 0px)); left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 14px;
    z-index: 3;
    opacity: 0.18;
    transition: opacity 0.4s;
  }
  .theme-dots:hover { opacity: 1; }

  .theme-dot {
    width: 13px; height: 13px;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.25);
    cursor: pointer;
    position: relative;
    transition: all 0.25s ease;
  }
  .theme-dot:hover { transform: scale(1.45); }
  .theme-dot.active {
    border-color: var(--text);
    transform: scale(1.28);
    box-shadow: 0 0 12px var(--text-glow1);
  }
  .theme-dot::after {
    content: attr(data-label);
    position: absolute;
    bottom: 24px; left: 50%;
    transform: translateX(-50%);
    font-size: 11px;
    white-space: nowrap;
    color: var(--date-color);
    opacity: 0;
    transition: opacity 0.25s;
    pointer-events: none;
    font-family: -apple-system, 'PingFang SC', 'Hiragino Sans GB', sans-serif;
    letter-spacing: 0.08em;
  }
  .theme-dot:hover::after { opacity: 1; }

  /* ==================== 触屏适配 ==================== */
  /* 无鼠标悬停，圆点常显 0.55；点按热区扩到约 41px，避免 13px 小圆点点不中 */
  @media (pointer: coarse) {
    .theme-dots { opacity: 0.55; gap: 20px; }
    .theme-dots:hover { opacity: 0.55; }
    .theme-dot { width: 15px; height: 15px; }
    .theme-dot::before {
      content: '';
      position: absolute;
      inset: -13px;
      border-radius: 50%;
    }
    .theme-dot:hover { transform: none; }
    .theme-dot.active { transform: scale(1.2); }
    .theme-dot::after { bottom: 26px; }
  }

  /* 双击进入「净屏」：只剩时间与句子 */
  body.bare .theme-dots,
  body.bare .hint { opacity: 0; pointer-events: none; }

  /* ==================== 底部提示 ==================== */
  .hint {
    position: fixed;
    bottom: calc(26px + env(safe-area-inset-bottom, 0px)); left: 50%;
    transform: translateX(-50%);
    font-size: clamp(11px, 0.78vw, 15px);
    color: var(--hint-color);
    letter-spacing: 0.13em;
    font-weight: 400;
    transition: color 0.8s, opacity 0.5s ease;
    z-index: 3;
    text-align: center;
    white-space: nowrap;
    font-family: -apple-system, 'PingFang SC', 'Hiragino Sans GB', sans-serif;
  }

  /* ==================== 异常自检提示（正常时不显示） ==================== */
  #diag {
    position: fixed;
    top: 16px; left: 50%;
    transform: translateX(-50%);
    background: rgba(180, 40, 40, 0.92);
    color: #fff;
    padding: 10px 18px;
    border-radius: 6px;
    font-size: 14px;
    font-family: -apple-system, 'PingFang SC', 'Hiragino Sans GB', sans-serif;
    z-index: 999;
    display: none;
    max-width: 90vw;
    line-height: 1.5;
  }

  /* 入场动画：只做位移，不用 opacity:0 起始，避免动画不执行时内容不可见 */
  @keyframes slideUp {
    0%   { transform: translateY(26px); }
    100% { transform: translateY(0); }
  }
  .time        { animation: slideUp 0.9s cubic-bezier(.2,.8,.3,1); }
  .date        { animation: slideUp 0.9s 0.15s cubic-bezier(.2,.8,.3,1); }
  .sloganWrap  { animation: slideUp 0.9s 0.3s cubic-bezier(.2,.8,.3,1); }
</style>
</head>
<body data-theme="default">

<canvas id="particleCanvas"></canvas>
<div id="cursorGlow"></div>
<div id="diag"></div>

<div class="container">
  <div class="time" id="timeDisplay"><span id="hourMin">--:--</span><span class="seconds" id="secDisplay">--</span></div>
  <div class="date" id="dateDisplay">正在加载…</div>
  <div class="separator"></div>
  <div class="sloganWrap">
    <div class="slogan" id="sloganDisplay">长风破浪会有时，直挂云帆济沧海</div>
    <div class="sweep" id="sweepLine"></div>
  </div>
</div>

<div class="theme-dots" id="themeDots"></div>
<div class="hint" id="hintBar">空格换句 · S 换皮肤 · 双击全屏</div>

<!-- ============================================================
     第一段：核心时间功能（独立运行，绝不依赖特效）
     ============================================================ -->
<script>
(function () {
  'use strict';

  var WEEK_NAMES = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
  var hourMinEl = document.getElementById('hourMin');
  var secEl     = document.getElementById('secDisplay');
  var dateEl    = document.getElementById('dateDisplay');
  var timeWrap  = document.getElementById('timeDisplay');
  var diagEl    = document.getElementById('diag');

  var lastTimeStr = '';
  var lastSecStr  = '';
  var lastDateStr = '';
  var lastMinute  = -1;

  function updateTime() {
    try {
      var now = new Date();
      // 北京时间 = UTC+8，与系统时区设置解耦
      var bj = new Date(now.getTime() + (now.getTimezoneOffset() * 60000) + (8 * 3600000));

      var h   = String(bj.getHours()).padStart(2, '0');
      var min = String(bj.getMinutes()).padStart(2, '0');
      var sec = String(bj.getSeconds()).padStart(2, '0');

      var timeStr = h + ':' + min;
      if (timeStr !== lastTimeStr) {
        hourMinEl.textContent = timeStr;
        lastTimeStr = timeStr;
        if (timeWrap) {
          timeWrap.classList.remove('tick');
          void timeWrap.offsetWidth;
          timeWrap.classList.add('tick');
        }
      }

      if (sec !== lastSecStr) {
        secEl.textContent = sec;
        lastSecStr = sec;
        secEl.classList.remove('tick');
        void secEl.offsetWidth;
        secEl.classList.add('tick');
      }

      // 分钟变化时才刷新日期
      var mNow = bj.getMinutes();
      if (mNow !== lastMinute) {
        lastMinute = mNow;
        var dateStr = bj.getFullYear() + '年' +
                      String(bj.getMonth() + 1).padStart(2, '0') + '月' +
                      String(bj.getDate()).padStart(2, '0') + '日 ' +
                      WEEK_NAMES[bj.getDay()];
        if (dateStr !== lastDateStr) {
          dateEl.textContent = dateStr;
          lastDateStr = dateStr;
        }
      }
    } catch (e) {
      if (diagEl) {
        diagEl.style.display = 'block';
        diagEl.textContent = '时间更新异常：' + (e && e.message ? e.message : e);
      }
    }
  }

  updateTime();
  setInterval(updateTime, 250);

  window.__clockCore = { updateTime: updateTime };
})();
</script>

<!-- ============================================================
     第二段：特效与交互（全部隔离，出错也不影响时间显示）
     ============================================================ -->
<script>
(function () {
  'use strict';

  /* ---------- 安全存储（file:// 下 localStorage 可能被拦截） ---------- */
  function lsGet(k, d) { try { var v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

  /* ---------- 主题 ---------- */
  var THEMES = [
    { id: 'default',      label: '午夜经典', dot: '#16202e' },
    { id: 'navy-star',    label: '藏青·星河', dot: '#1a3a6a' },
    { id: 'navy-aurora',  label: '藏青·极光', dot: '#0d4444' },
    { id: 'forest',       label: '墨绿·森林', dot: '#1d5232' },
    { id: 'forest-night', label: '墨绿·暗夜', dot: '#4a3620' }
  ];

  var RGB_MAP = {
    'default':      '0,200,255',
    'navy-star':    '180,210,255',
    'navy-aurora':  '0,220,200',
    'forest':       '80,200,120',
    'forest-night': '212,164,76'
  };

  var currentTheme = lsGet('clock-theme', 'default');
  var particleColor = RGB_MAP[currentTheme] || '0,200,255';

  function applyTheme(id) {
    try { document.body.setAttribute('data-theme', id); } catch (e) {}
    lsSet('clock-theme', id);
    currentTheme = id;
    particleColor = RGB_MAP[id] || '0,200,255';
    try {
      var dots = document.querySelectorAll('.theme-dot');
      for (var i = 0; i < dots.length; i++) {
        if (dots[i].getAttribute('data-theme') === id) dots[i].classList.add('active');
        else dots[i].classList.remove('active');
      }
    } catch (e) {}
  }

  /* ---------- 创建皮肤选择器 ---------- */
  try {
    var dotsBox = document.getElementById('themeDots');
    THEMES.forEach(function (t) {
      var d = document.createElement('div');
      d.className = 'theme-dot';
      d.setAttribute('data-theme', t.id);
      d.setAttribute('data-label', t.label);
      d.style.background = t.dot;
      d.addEventListener('click', function (ev) {
        ev.stopPropagation();
        applyTheme(t.id);
      });
      dotsBox.appendChild(d);
    });
  } catch (e) {}
  applyTheme(currentTheme);

  /* ---------- 粒子系统 ---------- */
  try {
    var canvas = document.getElementById('particleCanvas');
    var ctx = canvas ? canvas.getContext('2d') : null;

    if (ctx) {
      var particles = [];

      function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      resizeCanvas();
      window.addEventListener('resize', resizeCanvas);

      function Particle() { this.reset(true); }
      Particle.prototype.reset = function (atRandomPos) {
        this.x = Math.random() * canvas.width;
        this.y = atRandomPos ? Math.random() * canvas.height : canvas.height + 10;
        this.size = Math.random() * 2.2 + 0.6;
        this.speedX = (Math.random() - 0.5) * 0.28;
        this.speedY = (Math.random() - 0.5) * 0.28;
        this.opacity = Math.random() * 0.38 + 0.10;
        this.phase = Math.random() * Math.PI * 2;
        this.pulseSpeed = Math.random() * 0.018 + 0.004;
      };
      Particle.prototype.update = function () {
        this.x += this.speedX;
        this.y += this.speedY;
        this.phase += this.pulseSpeed;
        if (this.x < -12) this.x = canvas.width + 12;
        if (this.x > canvas.width + 12) this.x = -12;
        if (this.y < -12) this.y = canvas.height + 12;
        if (this.y > canvas.height + 12) this.y = -12;
      };
      Particle.prototype.draw = function () {
        var o = this.opacity * (0.62 + 0.38 * Math.sin(this.phase));
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(' + particleColor + ',' + o.toFixed(3) + ')';
        ctx.fill();
      };

      // iPad 上略减量，肉眼几乎无差，耗电与发热更低
      var PCOUNT = 48;
      for (var pi = 0; pi < PCOUNT; pi++) particles.push(new Particle());

      (function loop() {
        try {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          for (var i = 0; i < particles.length; i++) {
            particles[i].update();
            particles[i].draw();
          }

  }

  document.addEventListener('touchstart', function (e) {
    if (e.touches.length !== 1) { tMoved = true; return; }
    var t = e.touches[0];
    tStartX = t.clientX; tStartY = t.clientY; tStartT = Date.now();
    tMoved = false;
  }, { passive: true });

  document.addEventListener('touchmove', function (e) {
    if (e.touches.length !== 1) return;
    var t = e.touches[0];
    if (Math.abs(t.clientX - tStartX) > 12 || Math.abs(t.clientY - tStartY) > 12) tMoved = true;
  }, { passive: true });

  document.addEventListener('touchend', function (e) {
    if (isDot(e.target)) return;                       // 点在皮肤圆点上，交给它自己处理
    var dt = Date.now() - tStartT;
    var endX = e.changedTouches && e.changedTouches[0] ? e.changedTouches[0].clientX : tStartX;
    var dx = endX - tStartX;

    // ① 横向滑动超过 60px → 换皮肤（左滑下一种，右滑上一种）
    if (tMoved && Math.abs(dx) > HIT_SWIPE && dt < 900) {
      var idx = 0;
      for (var i = 0; i < THEMES.length; i++) if (THEMES[i].id === currentTheme) idx = i;
      var step = dx < 0 ? 1 : -1;
      applyTheme(THEMES[(idx + step + THEMES.length) % THEMES.length].id);
      return;
    }
    if (tMoved || dt > TAP_MAX) return;                 // 拖动或长按，不算点击

    // ② 双击 → 净屏
    var now = Date.now();
    if (now - lastTapT < DBL_GAP) {
      if (tapTimer) { clearTimeout(tapTimer); tapTimer = null; }
      lastTapT = 0;
      toggleChrome();
      return;
    }
    // ③ 单击 → 换句（延迟 DBL_GAP，让双击有机会插入）
    lastTapT = now;
    if (tapTimer) clearTimeout(tapTimer);
    tapTimer = setTimeout(function () { tapTimer = null; nextSlogan(); }, DBL_GAP);
  });

  /* 桌面端：鼠标点击换句、双击进全屏
     双击时浏览器会先连发两次 click，若直接响应会把标语跳过两句，
     所以单击延迟 240ms 执行，双击到来时撤销这次单击。 */
  var deskTapTimer = null;
  document.addEventListener('click', function (e) {
    if (isDot(e.target)) return;
    if ('ontouchstart' in window) return;   // 触屏已由 touchend 处理，避免重复触发
    if (deskTapTimer) {                     // 这是双击的第二下
      clearTimeout(deskTapTimer); deskTapTimer = null;
      return;
    }
    deskTapTimer = setTimeout(function () { deskTapTimer = null; nextSlogan(); }, 240);
  });

  document.addEventListener('dblclick', function (e) {
    if (isDot(e.target)) return;
    if ('ontouchstart' in window) return;
    if (deskTapTimer) { clearTimeout(deskTapTimer); deskTapTimer = null; }
    if (isFull()) exitFullscreen(); else enterFullscreen();
  });

  /* 提示文案按设备切换 */
  try {
    var hintEl = document.getElementById('hintBar');
    if (hintEl && 'ontouchstart' in window) {
      hintEl.textContent = '轻点换句 · 左右滑动换皮肤 · 双击净屏';
    }
  } catch (e) {}

  /* 恢复上次的净屏状态 */
  try {
    if (lsGet('clock-bare', '0') === '1') document.body.classList.add('bare');
  } catch (e) {}

})();
</script>
</body>
</html>
